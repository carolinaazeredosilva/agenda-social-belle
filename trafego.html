<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tráfego Pago · Belle</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#F8F3FB;color:#381B49;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1160px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:22px}
a.back{color:#A11176;text-decoration:none;font-weight:600;font-size:13px}
.wins{display:flex;gap:6px;flex-wrap:wrap}
.wins button{background:#fff;border:1px solid #E6DCEE;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:#381B49}
.wins button.on{background:#381B49;color:#fff;border-color:#381B49}
.updated{font-size:12px;color:#7D6F8B;margin:6px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.k{background:#fff;border:1px solid #E6DCEE;border-radius:14px;padding:12px;border-left:4px solid #E6DCEE}
.k.ok{border-left-color:#1F8A5B}
.k.warn{border-left-color:#C29A00}
.k.bad{border-left-color:#B42318}
.k span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7D6F8B;font-weight:600;display:block}
.k b{display:block;font-size:22px;color:#381B49;margin:4px 0}
.k em{font-size:12px;color:#5A4869;font-style:normal}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #E6DCEE;border-radius:14px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #E6DCEE;vertical-align:top}
th{background:#F3EDF8;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7D6F8B}
tr.adset td{background:#FAF7FC;font-size:12px;color:#5A4869}
tr.ad td{background:#FDFAFE;font-size:12px;color:#7D6F8B}
.btn-row{cursor:pointer}
.btn-row:hover td{background:#F3EDF8}
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 8px;border:1px solid #7D6F8B;color:#7D6F8B;white-space:nowrap}
.badge.scale{border-color:#1F8A5B;color:#1F8A5B}
.badge.kill{border-color:#B42318;color:#B42318}
.badge.keep{border-color:#5A4FCF;color:#5A4FCF}
.badge.wait{border-color:#A596B5;color:#A596B5}
.status-on{color:#1F8A5B;font-weight:600}
.loading,.err{padding:24px;text-align:center;color:#7D6F8B;background:#fff;border:1px dashed #E6DCEE;border-radius:14px}
.hint{font-size:12px;color:#7D6F8B;margin-top:14px}
code{background:#EFE6F5;padding:1px 6px;border-radius:4px;font-size:12px}
section{margin-bottom:18px}
h2{font-size:14px;color:#381B49;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tráfego Pago</h1>
      <a class="back" href="./">← voltar à Agenda</a>
    </div>
    <div class="wins" id="wins"></div>
  </header>
  <div id="updated" class="updated"></div>
  <main id="root"><div class="loading">Carregando…</div></main>
  <p class="hint">A operação (criar campanha, pausar, escalar) é pelo Claude Code — digite <code>/agente-trafego-pago</code>. Essa página só mostra os dados que o fetcher gera 3×/dia.</p>
</div>
<script>
const WINS=[4,7,14,30]; let cur=7; const cache={}; const expanded={};
const brl=v=>'R$ '+(Math.round((+v||0)*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const i=v=>Math.round(+v||0).toLocaleString('pt-BR');
const pct=v=>v==null?'—':((v>=0?'+':'')+(+v).toFixed(1).replace('.',',')+'%');
const sc=s=>s==='green'?'ok':s==='yellow'?'warn':s==='red'?'bad':'';
const sl=s=>s==='green'?'na meta':s==='yellow'?'atenção':s==='red'?'fora da meta':'';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const bdg=d=>!d?'':d==='SCALE'?'<span class="badge scale">Escalar</span>':d==='KILL'?'<span class="badge kill">Matar</span>':d==='KEEP'?'<span class="badge keep">Manter</span>':'<span class="badge wait">Amostra baixa</span>';
const kn={cpl:'CPL',cpa:'CPA',roas:'ROAS',cpm:'CPM',ctr:'CTR',cpc:'CPC',custo_msg:'Custo/Msg',frequencia:'Frequência',custo_install:'Custo/Install'};
const kf=(k,v)=>v==null?'—':(k==='ctr'||k==='frequencia')?(+v).toFixed(2).replace('.',',')+(k==='ctr'?'%':''):k==='roas'?(+v).toFixed(2).replace('.',','):brl(v);

function renderWins(){ document.getElementById('wins').innerHTML=WINS.map(w=>'<button data-w="'+w+'" class="'+(w===cur?'on':'')+'">'+w+' dias</button>').join(''); }
function load(w,cb){ if(cache[w]!==undefined) return cb(cache[w]); fetch('trafego/paid-traffic-'+w+'d.json?t='+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(j=>{cache[w]=j;cb(j);}).catch(()=>{cache[w]=null;cb(null);}); }
function render(){
  renderWins();
  const r=document.getElementById('root'); r.innerHTML='<div class="loading">Carregando janela de '+cur+' dias…</div>';
  load(cur,d=>{
    if(!d){ r.innerHTML='<div class="err">Sem dados para '+cur+' dias ainda. Rode <code>/meta-metrics-fetcher</code> no Claude.</div>'; return; }
    const g=d.generated_at?new Date(d.generated_at):null;
    document.getElementById('updated').textContent=g?('Atualizado em '+String(g.getDate()).padStart(2,'0')+'/'+String(g.getMonth()+1).padStart(2,'0')+'/'+g.getFullYear()+' às '+String(g.getHours()).padStart(2,'0')+':'+String(g.getMinutes()).padStart(2,'0')+' · conta '+(d.ad_account_id||'')+' · '+(d.currency||'')):'';
    const sum=d.kpis_summary||{}, primary=d.primary_kpi||'cpl';
    const camps=(d.campaigns||[]).slice().sort((a,b)=>(b.spend||0)-(a.spend||0));
    const totLeads=camps.reduce((s,c)=>s+((c.raws&&c.raws.leads)||0),0);
    const totImp=camps.reduce((s,c)=>s+((c.raws&&c.raws.impressions)||0),0);
    const totClk=camps.reduce((s,c)=>s+((c.raws&&c.raws.clicks)||0),0);
    const ctr=totImp?(totClk/totImp*100):null, cpc=totClk?((d.spend_total||0)/totClk):null, cpm=totImp?((d.spend_total||0)/totImp*1000):null;
    let h='<section><div class="kpis">';
    (d.perfil_kpis||[primary]).forEach(k=>{const s=sum[k]; if(!s) return;
      h+='<div class="k '+sc(s.status)+'"><span>'+(kn[k]||k.toUpperCase())+(k===primary?' · primário':'')+'</span><b>'+kf(k,s.value)+'</b><em>meta '+kf(k,s.target)+' · '+pct(s.delta_pct)+' · '+sl(s.status)+'</em></div>';
    });
    h+='<div class="k"><span>Gasto</span><b>'+brl(d.spend_total)+'</b><em>'+camps.length+' campanha(s)</em></div>';
    h+='<div class="k"><span>Leads</span><b>'+i(totLeads)+'</b><em>'+i(totClk)+' cliques</em></div>';
    h+='<div class="k"><span>CTR</span><b>'+(ctr!=null?ctr.toFixed(2).replace('.',',')+'%':'—')+'</b><em>CPM '+(cpm!=null?brl(cpm):'—')+' · CPC '+(cpc!=null?brl(cpc):'—')+'</em></div>';
    h+='</div></section>';
    h+='<h2>Campanhas</h2><table><thead><tr><th>Campanha</th><th>Status</th><th>Gasto</th><th>Leads</th><th>CPL</th><th>Decisão</th></tr></thead><tbody>';
    camps.forEach(c=>{const cpl=c.metrics&&c.metrics.cpl, st=c.effective_status||'—', le=(c.raws&&c.raws.leads)||0;
      h+='<tr class="btn-row" data-id="'+esc(c.campaign_id)+'"><td>'+esc(c.name||'')+'</td><td><span class="'+(st==='ACTIVE'?'status-on':'')+'">'+esc(st)+'</span></td><td><b>'+brl(c.spend)+'</b></td><td>'+i(le)+'</td><td>'+(cpl!=null?brl(cpl):'—')+'</td><td>'+bdg(c.decide)+'</td></tr>';
      if(expanded[c.campaign_id]){
        (c.adsets||[]).forEach(as=>{const asc=as.metrics&&as.metrics.cpl, asl=(as.raws&&as.raws.leads)||0;
          h+='<tr class="adset"><td>↳ '+esc(as.name||'')+'</td><td></td><td>'+brl(as.spend)+'</td><td>'+i(asl)+'</td><td>'+(asc!=null?brl(asc):'—')+'</td><td></td></tr>';
          (as.ads||[]).forEach(ad=>{const ac=ad.metrics&&ad.metrics.cpl, al=(ad.raws&&ad.raws.leads)||0;
            h+='<tr class="ad"><td>· '+esc(ad.ad_name||'')+'</td><td></td><td>'+brl(ad.spend)+'</td><td>'+i(al)+'</td><td>'+(ac!=null?brl(ac):'—')+'</td><td>'+bdg(ad.decide)+'</td></tr>';
          });
        });
      }
    });
    h+='</tbody></table>';
    r.innerHTML=h;
  });
}
document.addEventListener('click',e=>{
  const w=e.target.closest('button[data-w]'); if(w){cur=+w.dataset.w; render(); return;}
  const row=e.target.closest('tr.btn-row'); if(row){const id=row.dataset.id; expanded[id]=!expanded[id]; render();}
});
render();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="belle-ver" content="20261111093527">
<title>Agenda Social Belle</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A11176">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda Social">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shim.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap">
<style>
/* Layout: uma coluna mobile-first. Cabeçalho, conteúdo da aba (Hoje, Calendário, Feed) e barra de abas fixa embaixo. Detalhe do item abre como folha de tela cheia. */
:root{
  --bg:#F8F3FB; --panel:#FFFFFF; --ink:#381B49; --body:#5A4869; --muted:#7D6F8B;
  --line:#E6DCEE; --accent:#A11176; --accent-ink:#FFFFFF; --violet:#6C4BE0; --cyan-soft:#DCF1FA; --tile:#EFE6F5;
  --s-ideia:#7D6F8B; --s-prod:#B7791F; --s-ok:#C29A00; --s-agend:#5A4FCF; --s-pub:#A11176;
  --meta:#1D4ED8; --danger:#B42318; --s-green:#1F8A5B; --shade:rgba(56,27,73,.10);
  --font-display:'Montserrat',system-ui,sans-serif; --font-body:'Open Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150C1D; --panel:#22132E; --ink:#F4ECFA; --body:#CDBFD9; --muted:#A596B5;
  --line:#3A2749; --accent:#F58BD8; --accent-ink:#2A0B22; --violet:#A58BFF; --cyan-soft:#1D3340; --tile:#2D1B3B;
  --s-ideia:#A596B5; --s-prod:#E9B44C; --s-ok:#FFD84D; --s-agend:#A9A0F5; --s-pub:#F58BD8;
  --meta:#9DB8FF; --danger:#FF8A80; --s-green:#4CC38A; --shade:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150C1D; --panel:#22132E; --ink:#F4ECFA; --body:#CDBFD9; --muted:#A596B5;
  --line:#3A2749; --accent:#F58BD8; --accent-ink:#2A0B22; --violet:#A58BFF; --cyan-soft:#1D3340; --tile:#2D1B3B;
  --s-ideia:#A596B5; --s-prod:#E9B44C; --s-ok:#FFD84D; --s-agend:#A9A0F5; --s-pub:#F58BD8;
  --meta:#9DB8FF; --danger:#FF8A80; --s-green:#4CC38A; --shade:rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:color-mix(in srgb,var(--bg) 70%,#F3F0F5);color:var(--body);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);color:var(--ink);margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;position:relative}
.top::after{content:none}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px;min-height:18px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.iconbtn.spin svg{animation:none}}

.banner{margin-top:14px;border:1px solid var(--line);background:var(--cyan-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:13px}
.banner.err{background:transparent;border-color:var(--danger);color:var(--danger)}
.banner b{font-weight:600}

.weekbar{display:flex;align-items:center;gap:6px;margin:16px 0 4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.dp{border:1px solid transparent;background:transparent;border-radius:14px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.dp .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dp .d{font:700 17px/1.2 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.dp .dots{display:flex;gap:3px;height:7px;align-items:center}
.dp .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dp .dots i.s{background:var(--violet)}
.dp[aria-current="date"]{border-color:var(--line)}
.dp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.dp[aria-pressed="true"] .w,.dp[aria-pressed="true"] .d{color:var(--bg)}
.dp[aria-pressed="true"] .dots i{background:var(--bg)}
.daytitle{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 0 6px}
.daytitle h2{font-size:19px;font-weight:700}
.daytitle h2::first-letter,.mhead h2::first-letter{text-transform:uppercase}
.linkbtn{white-space:nowrap;background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:6px 0}

.sec{margin-top:20px}
.sec>h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.meter{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 0 10px}
.meter i{display:block;height:100%;background:var(--s-ok);width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-bottom:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .main{flex:1;min-width:0}
.card .t{font:700 13px/1.3 var(--font-display);color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .x{margin-top:3px;font-size:14px;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;color:var(--body);display:inline-flex;gap:5px;align-items:center;background:transparent;min-height:24px;font-variant-numeric:tabular-nums}
.chip.manual{border-color:var(--accent);color:var(--accent)}
.chip.time{color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.pill{font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:1px 9px;color:var(--pc,var(--muted));border:1px solid var(--pc,var(--line));white-space:nowrap}
.pill[data-s="Ideia"]{--pc:var(--s-ideia)}.pill[data-s="Em produção"]{--pc:var(--s-prod)}.pill[data-s="Aprovado"]{--pc:var(--s-ok)}.pill[data-s="Agendado"]{--pc:var(--s-agend)}.pill[data-s="Publicado"]{--pc:var(--s-pub)}
.sel{position:relative;display:inline-flex;--pc:var(--muted)}
.sel[data-s="Ideia"]{--pc:var(--s-ideia)}.sel[data-s="Em produção"]{--pc:var(--s-prod)}.sel[data-s="Aprovado"]{--pc:var(--s-ok)}.sel[data-s="Agendado"]{--pc:var(--s-agend)}.sel[data-s="Publicado"]{--pc:var(--s-pub)}
.sel::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;border-right:1.5px solid var(--pc);border-bottom:1.5px solid var(--pc);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.st-sel{appearance:none;-webkit-appearance:none;font:700 11px/1.4 var(--font-body);border-radius:999px;padding:3px 24px 3px 10px;color:var(--pc);border:1px solid var(--pc);background:transparent;min-height:26px;cursor:pointer}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent;margin-top:1px}
.ck svg{width:16px;height:16px}
.ck[aria-pressed="true"]{background:var(--s-green);border-color:var(--s-green);color:#fff}
.thumb{width:56px;aspect-ratio:4/5;border-radius:10px;background:var(--tile);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.note{font-size:13px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}

/* mês */
.month{margin-top:16px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mhead h2{font-size:19px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:2px;font-weight:600}
.cell{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.cell.out{opacity:.4}
.cell .n{font:700 14px/1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.cell.today{border-color:var(--accent)}
.cell.dz-todo{background:color-mix(in srgb,var(--danger) 12%,var(--panel));border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.cell.dz-ok{background:color-mix(in srgb,var(--s-green) 16%,var(--panel));border-color:color-mix(in srgb,var(--s-green) 60%,var(--line))}
.cell.today.dz-todo{box-shadow:0 0 0 2px var(--accent)}.cell.today.dz-ok{box-shadow:0 0 0 2px var(--s-green)}
.legend .dz{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.cell .mk{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:10px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.cell .mk b{width:100%;display:flex;gap:3px;justify-content:center;align-items:center;font-weight:600}
.cell .mk i{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--muted))}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:8px;height:8px;border-radius:50%}

/* feed */
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.fchips .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fhint{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:var(--panel);padding:3px;border-radius:18px;border:1px solid var(--line)}
.tile{position:relative;aspect-ratio:3/4;background:var(--tile);overflow:hidden;border:0;padding:0;border-radius:4px;display:block;width:100%;text-align:left}
.tile:first-child{border-top-left-radius:15px}.tile:nth-child(3){border-top-right-radius:15px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:8px;text-align:center;font:600 11px/1.3 var(--font-display);color:var(--muted)}
.tile .ph b{color:var(--ink);font-weight:700;font-size:12px;overflow-wrap:anywhere}
.tile .bd{position:absolute;left:5px;bottom:5px;display:flex;gap:5px;align-items:center;background:rgba(20,8,28,.66);color:#fff;border-radius:999px;padding:1px 8px 1px 6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .bd i{width:7px;height:7px;border-radius:50%;background:var(--pc,#fff)}
.tile .ly{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:6px;background:rgba(20,8,28,.6);display:grid;place-items:center;color:#fff}
.tile .ly svg{width:13px;height:13px}

/* folha de detalhe */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(21,12,29,.55);display:flex;justify-content:center;align-items:flex-end}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;height:100%;max-height:100%;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{height:auto;max-height:92%;border-radius:24px;padding-top:20px}}
.ph-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ph-head h2{font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;min-width:0}
.blk>h4{margin:0 0 8px;font:700 12px/1.3 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;color:var(--ink);margin:0}
.txt.sm{font-size:13px;color:var(--body)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;min-height:38px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.in{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:15px;width:100%;min-width:0}
.in:focus{outline:2px solid var(--violet);outline-offset:0;border-color:var(--violet)}
textarea.in{resize:vertical;line-height:1.5}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
label.f:first-of-type{margin-top:0}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-bottom:10px}
.art{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--tile);border:1px solid var(--line)}
.art img,.art video{width:100%;height:100%;object-fit:cover;display:block}
.art .acts{position:absolute;left:4px;right:4px;bottom:4px;display:flex;justify-content:space-between;gap:4px}
.art .acts button{border:0;border-radius:999px;width:30px;height:30px;background:rgba(20,8,28,.7);color:#fff;display:grid;place-items:center}
.art .acts button.armed{background:var(--danger)}
.art .no{position:absolute;top:4px;left:4px;background:rgba(20,8,28,.7);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px}
.cl{display:flex;flex-direction:column;gap:2px}
.cl button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 2px;font-size:15px;color:var(--ink);min-height:44px}
.cl .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.cl .bx svg{width:14px;height:14px}
.cl button[aria-pressed="true"] .bx{background:var(--s-ok);border-color:var(--s-ok);color:#fff}
.cl button[aria-pressed="true"] span.l{text-decoration:line-through;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}

.ph-head h2::first-letter{text-transform:uppercase}
.dsum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;margin-top:12px}
.tl .tm{font:700 14px/1.2 var(--font-display);color:var(--ink);padding-top:14px;font-variant-numeric:tabular-nums}
.tl .tm.none{font-size:12px;color:var(--muted);font-weight:600}
.tl .tc{min-width:0}
/* menu lateral */
.side{position:fixed;top:0;bottom:0;left:0;z-index:50;width:244px;background:var(--panel);border-right:1px solid var(--line);padding:24px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;overflow-y:auto;transform:translateX(-105%);transition:transform .22s ease}
.side.open{transform:none;box-shadow:0 0 48px var(--shade)}
.brand b{display:block;font:800 20px/1.1 var(--font-display);color:var(--ink)}
.brand span{font-size:12px;color:var(--muted)}
.brand::after{content:"";display:block;height:3px;border-radius:3px;margin-top:14px;background:linear-gradient(135deg,#A11176,#8461F4,#81D8E5)}
.side .in-tabs{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:14px;min-height:46px;padding:0 14px;font:600 15px/1.2 var(--font-body);color:var(--body);text-align:left;width:100%}
.tab svg{width:20px;height:20px}
.tab:hover{background:var(--tile)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--accent)}
/* painel gerencial */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font:800 28px/1.1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.kpi em{font-style:normal;font-size:11px;color:var(--muted)}
.kpi.hot b{color:var(--danger)}.kpi.warm b{color:var(--s-prod)}.kpi.ok b{color:var(--s-ok)}
.rw{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;min-width:0}
.rw:hover{border-color:var(--accent)}
.rd{display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.rd b{font:700 14px/1.2 var(--font-display);color:var(--ink)}
.rd span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rm{display:flex;flex-direction:column;gap:3px;min-width:0}
.rt{font:700 13px/1.3 var(--font-display);color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rs{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rm .meter{margin:2px 0}
.due{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.due.hot{color:var(--danger);border-color:var(--danger)}.due.warm{color:var(--s-prod);border-color:var(--s-prod)}.due.ok{color:var(--s-ok);border-color:var(--s-ok)}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px}
.wkh{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:8px;color:var(--muted)}
.wkh b{font:700 13px var(--font-display);color:var(--ink)}
.wkh .hot{color:var(--danger);font-weight:700}.wkh .warm{color:var(--s-prod);font-weight:700}.wkh .ok{color:var(--s-ok);font-weight:700}
.wkg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

  document.addEventListener('pointerdown',e=>{
    const g=e.target.closest&&e.target.closest('.grip'); if(!g) return;
    const card=g.closest('.tlr.st')||g.closest('.card.st'); if(!card||!card.parentElement) return;
    const cards=[...card.parentElement.querySelectorAll(card.classList.contains('tlr')?':scope > .tlr.st':':scope > .card.st')]; if(cards.length<2) return;
    e.preventDefault();
    const rects=cards.map(c=>c.getBoundingClientRect()), idx=cards.indexOf(card);
    const gap=Math.max(0,rects[1].top-rects[0].bottom), step=rects[idx].height+gap;

    const r=drag.rects[drag.idx], mid=r.top+r.height/2+dy; let to=0;

  async function moveMeta(pairs){ // pairs: [[old,new],...]

    const target={}; touched.forEach(id=>{ target[id]={}; }); pairs.forEach(p=>{ target[p[1]]=snap[p[0]]; });
    touched.forEach(id=>{ if(!pairs.some(p=>p[1]===id)&&!pairs.some(p=>p[0]===id)) target[id]=snap[id]; });
    for(const id of touched){ meta.set(id,target[id]); await saveItem(id,{},true); }
  }

    { const its=fs.concat(ss).filter(x=>statusOf(x)!=='Publicado'), pend=its.filter(x=>needAlarm(x)&&(!alarmOk(x)||oldAviso(x))), comH=pend.filter(x=>M(x.id).hora), semH=pend.length-comH.length;

  /* ---------- artes: enviar, baixar, remover ---------- */
  async function addArts(files){
    const it=itemById(uploadFor); if(!it||!assets||!files.length||busy) return; busy=true;
    try{
      const ids=(M(it.id).art||[]).slice(); let n=0;
      if(replaceIdx!=null){
        const ri=replaceIdx; replaceIdx=null; toast('Enviando a nova arte…');
        const r=await assets.upload(files[0]); if(ri>=0&&ri<ids.length) ids[ri]=r.id; else ids.push(r.id);
        await saveItem(it.id,{art:ids},true); toast('Arte substituída'); renderAll(); if(openId) renderSheet(); return;
      }
      for(const f of files){ toast('Enviando '+(++n)+' de '+files.length+'…'); const r=await assets.upload(f); ids.push(r.id); }
      await saveItem(it.id,{art:ids},true); toast('Arte salva'); renderAll(); if(openId) renderSheet();
    }catch(e){ const c=e&&e.code; toast(c==='too_large'?'Arquivo acima de 20 MB':c==='unsupported_type'?'Use PNG, JPG, WebP, MP4 ou WebM':c==='quota_or_state'?'Espaço de armazenamento cheio':'Envio interrompido. Tente de novo.'); }
    finally{ busy=false; }
  }
  const EXT={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif','video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'};
  async function downloadArt(it,i){
    const id=artIds(it)[i]; if(!id) return;
    if(!dls){ window.open('/_blob/'+id,'_blank'); return; }
    try{
      const r=await fetch('/_blob/'+id); const b=await r.blob(); const ext=EXT[b.type]||'png';
      const nm='belle-'+it.date+'-'+(it.kind==='feed'?'feed':it.kind==='destaque'?'destaque':'story'+it.n)+'-'+(i+1)+'.'+ext;
      await dls.save({filename:nm,data:b}); return true;
    }catch(e){ if(e&&e.code==='declined') return false; toast('Não consegui baixar. Segure a imagem para salvar.'); return false; }
  }
  async function downloadAll(it){ const n=artIds(it).length; for(let i=0;i<n;i++){ const ok=await downloadArt(it,i); if(ok===false) break; } }

    if(act==='day'){ sel=el.dataset.d; renderAll(); return; }
    if(act==='today'){ sel=todayIso(); renderAll(); return; }
    if(act==='wk'){ sel=addDays(sel,7*Number(el.dataset.n)); renderAll(); return; }
    if(act==='goto'){ openDay(el.dataset.d); return; }
    if(act==='dclose'){ closeDay(); return; }
    if(act==='unhide'){ await saveItem(el.dataset.id,{oculto:false},true); renderAll(); toast('Restaurado'); return; }
    if(act==='dsched'){
      const v=dHora; if(!v){ toast('Escolha o horário'); return; }
      const list=storiesOn(dayOpen).filter(x=>x.kind==='story'&&!stickersOf(x.sticker).length);
      if(!list.length){ toast('Sem stories simples neste dia'); return; }
      for(const x of list){ await saveItem(x.id,{hora:v,status:'Agendado'},true); }
      renderAll(); toast(list.length+(list.length===1?' story agendado':' stories agendados')+' às '+v); return;
    }
    if(act==='dview'){ dview=el.dataset.v; renderDay(); return; }
    if(act==='dnav'){ dayOpen=addDays(dayOpen,Number(el.dataset.n)); month=dayOpen.slice(0,7); renderAll(); $('#dpanel').scrollTop=0; return; }
    if(act==='dtoday'){ sel=dayOpen; view='hoje'; closeDay(); renderAll(); window.scrollTo(0,0); return; }
    if(act==='mon'){ const y=+month.slice(0,4), mo=+month.slice(5,7)-1+Number(el.dataset.n); const d=new Date(y,mo,1,12); month=d.getFullYear()+'-'+pad(d.getMonth()+1); renderAll(); return; }
    if(act==='hz'){ hz=+el.dataset.n||14; renderAll(); return; }
    if(act==='ff'){ fFilter=el.dataset.s; renderAll(); return; }
    if(act==='refresh'){ if(window.claude&&mcp) { try{ await mcp.invalidate(); }catch(_){} } load(); return; }
    const it=itemById(openId); if(!it) return;
    if(act==='status'){ await saveItem(it.id,{status:el.dataset.s},true); renderAll(); renderSheet(); return; }
    if(act==='inav'){ const sb=sibsOf(it), j=sb.findIndex(x=>x.id===it.id)+Number(el.dataset.n); if(j>=0&&j<sb.length){ openId=sb[j].id; renderSheet(); $('#panel').scrollTop=0; } return; }
    if(act==='sugg'){ await saveItem(it.id,{hora:el.dataset.h},true); renderAll(); renderSheet(); return; }
    if(act==='sched'){ await doSched(it); return; }
    if(act==='unsched'){ await doUnsched(it); return; }
    if(act==='sched_old'){
      const mm=M(it.id); if(!mm.hora){ toast('Informe o horário em que agendou'); const f=$('#f-hora'); if(f) f.focus(); return; }
      const ck=Object.assign({},mm.checks||{}); checklistFor(it).forEach(l=>{ if(/agendado no meta/i.test(l)) ck[l]=true; });
      await saveItem(it.id,{status:'Agendado',antes:statusOf(it),checks:ck},true); renderAll(); renderSheet(); toast('Marcado como agendado às '+mm.hora); return;
    }
    if(act==='unsched_old'){
      const mm=M(it.id), ck=Object.assign({},mm.checks||{}); checklistFor(it).forEach(l=>{ if(/agendado no meta/i.test(l)) ck[l]=false; });
      let back=mm.antes&&mm.antes!=='Agendado'?mm.antes:null;
      if(!back&&it.sheetStatus==='Agendado') back='Aprovado';
      await saveItem(it.id,{status:back,antes:null,checks:ck},true); renderAll(); renderSheet(); toast('Agendamento desmarcado · status: '+statusOf(it)); return;
    }
    if(act==='copy'){ copyText(copyReg[el.dataset.k]||''); return; }
    if(act==='copylink'){ const WA=(window.BELLE_CONFIG&&BELLE_CONFIG.WHATSAPP)||'https://wa.me/551132305180'; const l=M(it.id).link||(it.kind!=='feed'?WA:''); if(l) copyText(l); else toast('Cole um link primeiro'); return; }
    if(act==='copywa'){ copyText((window.BELLE_CONFIG&&BELLE_CONFIG.WHATSAPP)||'https://wa.me/551132305180'); return; }
    if(act==='chk'){ const l=checklistFor(it)[+el.dataset.i]; const ck=Object.assign({},M(it.id).checks||{}); ck[l]=!ck[l]; await saveItem(it.id,{checks:ck},true); renderSheet(); return; }
    if(act==='aadd'){ replaceIdx=null; uploadFor=it.id; $('#file-in').click(); return; }
    if(act==='tedit'){ editF=el.dataset.f; renderSheet(); const ta=$('#t-edit'); if(ta){ ta.focus(); ta.scrollIntoView({block:'center'}); } return; }
    if(act==='tcancel'){ editF=null; renderSheet(); return; }
    if(act==='tsave'){ const f=el.dataset.f, ta=$('#t-edit'); if(!ta||editBusy) return; const val=ta.value.replace(/\r\n/g,'\n');
      if(val.trim()===(it[f]||'').trim()){ editF=null; renderSheet(); return; }
      if(!window.belleSheets||!window.belleSheets.updateText){ toast('Gravação na planilha indisponível'); return; }
      const ord=it.kind==='feed'?+it.id.split('_')[2]:it.rowIdx;
      const pr=window.belleSheets.updateText({sheetId:SHEET_ID,kind:it.kind,date:it.date,ord:ord,n:it.kind==='story'?it.n:null,field:f,old:it[f]||'',value:val},parseDate,labelled);
      editBusy=true; renderSheet(); const keep=val;
      pr.then(()=>{ it[f]=keep; editF=null; editBusy=false; renderAll(); renderSheet(); toast('Salvo na planilha'); setTimeout(load,3000); })
        .catch(e=>{ editBusy=false; renderSheet(); const ta2=$('#t-edit'); if(ta2) ta2.value=keep; toast(e&&e.message?e.message:'Não consegui salvar na planilha'); });
      return; }
    if(act==='noart'){ const on=!M(it.id).semArte; await saveItem(it.id,{semArte:on},true); renderAll(); renderSheet(); toast(on?'Marcado como sem arte (repost)':'Volta a precisar de arte'); return; }
    if(act==='amove'){ const a=artIds(it).slice(), i=+el.dataset.i, k=i+Number(el.dataset.n); if(k<0||k>=a.length) return; const tmp=a[i]; a[i]=a[k]; a[k]=tmp; await saveItem(it.id,{art:a},true); renderAll(); renderSheet(); return; }
    if(act==='arep'){ replaceIdx=+el.dataset.i; uploadFor=it.id; $('#file-in').click(); return; }
    if(act==='shide'){
      if(el.dataset.armed!=='1'){ el.dataset.armed='1'; el.classList.add('armed'); toast('Toque de novo para excluir do app'); setTimeout(()=>{ if(el.isConnected){ el.dataset.armed='0'; el.classList.remove('armed'); } },3500); return; }
      const sb=sibsOf(it), j=sb.findIndex(x=>x.id===it.id), nb=sb[j+1]||sb[j-1]||null;
      await saveItem(it.id,{oculto:true},true); toast('Removido do app. A planilha não mudou.');
      if(nb){ openId=nb.id; renderAll(); renderSheet(); $('#panel').scrollTop=0; } else { closeItem(); }
      return;
    }
    if(act==='dl'){ downloadArt(it,+el.dataset.i); return; }
    if(act==='dlall'){ downloadAll(it); return; }
    if(act==='adel'){
      if(el.dataset.armed!=='1'){ el.dataset.armed='1'; el.classList.add('armed'); toast('Toque de novo para remover'); setTimeout(()=>{ if(el.isConnected){ el.dataset.armed='0'; el.classList.remove('armed'); } },3500); return; }
      const arts=artIds(it).slice(); const gone=arts.splice(+el.dataset.i,1)[0];
      await saveItem(it.id,{art:arts},true);
      if(assets&&gone){ assets.delete(gone).catch(()=>{}); }
      renderAll(); renderSheet(); return;
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if(openId) closeItem(); else if(dayOpen) closeDay(); }
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-act="open"]')){ e.preventDefault(); openItem(e.target.dataset.id); }
  });
  document.addEventListener('input',e=>{
    const t=e.target; if(t.id==='d-hora'){ dHora=t.value; return; }
    if(t.classList&&t.classList.contains('evin')&&t.type!=='date'){ saveItem(t.dataset.ev,{[t.dataset.k]:t.value}); return; }
    if(t.id==='id-q'){ idQ=t.value; const v=$('#view'); const pos=t.selectionStart; v.innerHTML=renderIdeias(); const n=$('#id-q'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} evHydrate(); return; }
    if(t.classList&&t.classList.contains('idin')&&idOpen){ saveItem(idOpen,{[t.dataset.k]:t.value}); return; }
    if(t.classList&&t.classList.contains('evresp')){ const ev=evById(t.dataset.ev); if(ev) saveItem(ev.id,{tarefas:(ev.tarefas||[]).map(x=>x.id===t.dataset.t?Object.assign({},x,{resp:t.value}):x)}); return; }
    if(t.classList&&t.classList.contains('evanote')){ const ev=evById(t.dataset.ev); if(ev) saveItem(ev.id,{arts:(ev.arts||[]).map(x=>x.id===t.dataset.a?Object.assign({},x,{nota:t.value}):x)}); return; }
    if(!openId) return;
    if(t.id==='f-link') saveItem(openId,{link:t.value.trim()});
    if(t.id==='f-note') saveItem(openId,{nota:t.value});
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.classList&&t.classList.contains('tchip')){ const id=t.dataset.id, v=t.value; saveItem(id,{hora:v},true).then(()=>{ renderAll(); toast(v?'Horário: '+v:'Horário removido'); }); return; }
    if(t.classList&&t.classList.contains('evst')){ evPatchT(t.dataset.ev,t.dataset.t,{st:t.value}).then(()=>{ renderAll(); toast(t.value); }); return; }
    if(t.classList&&t.classList.contains('evin')&&t.type==='date'){ saveItem(t.dataset.ev,{[t.dataset.k]:t.value},true).then(()=>renderAll()); return; }
    if(t.classList&&t.classList.contains('st-sel')){ saveItem(t.dataset.id,{status:t.value},true).then(()=>{ renderAll(); toast('Status: '+t.value); }); return; }
    if(!openId) return;
    if(t.id==='id-used'){ idShowUsed=t.checked; renderAll(); return; }
    if(t.id==='id-usada'&&idOpen){ saveItem(idOpen,{usada:t.checked},true).then(()=>{ renderAll(); toast(t.checked?'Marcada como usada':'De volta à lista'); }); return; }
    if(t.id==='f-ev'){ saveItem(openId,{evento:t.value||null},true).then(()=>{ renderAll(); toast(t.value?'Ligado ao evento':'Sem evento'); }); return; }
    if(t.id==='f-pin'){ const it=itemById(openId); if(!it) return; const n=+t.value;
      (async()=>{ if(n){ const other=feed.find(x=>x.id!==it.id&&pinOf(x)===n); if(other) await saveItem(other.id,{fixado:pinOf(it)||null},true); }
        await saveItem(it.id,{fixado:n||null},true); renderAll(); renderSheet(); toast(n?'Fixado em '+n+'º no perfil':'Desafixado'); })(); return; }
    if(t.id==='f-alarm'){ const it=itemById(openId); if(!it) return;
      if(t.checked){ saveItem(it.id,{querAlarme:true},true).then(()=>{ renderAll(); renderSheet(); }); if(M(it.id).hora&&!alarmOk(it)) makeAlarms([it]); else if(!M(it.id).hora) toast('Defina o horário para criar o alarme'); }
      else { const ev=M(it.id).gEvent; const done=()=>saveItem(it.id,{querAlarme:false,alarme:false,gEvent:null,gHora:null},true).then(()=>{ renderAll(); renderSheet(); toast(ev?'Alarme removido da agenda':'Sem alarme para este item'); });
        if(ev&&window.belleCal&&window.belleCal.remove){ window.belleCal.remove(ev).then(done).catch(()=>{ t.checked=true; toast('Não consegui remover do Google Agenda. Tente de novo.'); }); } else done(); }
      return; }
    if(t.id==='f-meta'){ const it=itemById(openId); if(!it) return; const v=t.value;
      if(v==='ag'||v==='agig') doSched(it,v==='agig'?'ig':null);
      else if(v==='nao') doUnsched(it);
      else { const mm=M(it.id), man=v==='manual'; saveItem(it.id,{status:'Publicado',manual:man,antes:statusOf(it)==='Publicado'?(mm.antes||null):statusOf(it)},true).then(()=>{ renderAll(); renderSheet(); toast(man?'Marcado como postado manualmente':'Marcado como publicado'); }); }
      return; }
    if(t.id==='f-hora'){ saveItem(openId,{hora:t.value},true).then(()=>{ renderAll(); const it=itemById(openId); const a=$('#gcal'); if(a&&it){ if(t.value){ a.href=gcalUrl(it,t.value); a.removeAttribute('aria-disabled'); } else { a.removeAttribute('href'); a.setAttribute('aria-disabled','true'); } } }); }
  });
  new MutationObserver(()=>{ if(document.querySelector('video[data-vblob]:not([data-h])')) evHydrate(); }).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('click',e=>{ const v=e.target.closest&&e.target.closest('.art video.vtap'); if(!v) return; e.preventDefault(); e.stopPropagation(); if(v.paused){ v.muted=false; v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); }); } else v.pause(); },true);
  document.addEventListener('paste',e=>{ if(view!=='ideias'||RO()) return; const a=document.activeElement; if(a&&/INPUT|TEXTAREA/.test(a.tagName)) return;
    const f=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(x=>/^(image|video)\//.test(x.type)); if(!f.length) return; e.preventDefault();
    if(idOpen) idAddImgs(f); else idCreate(f,{}); });
  $('#file-in').addEventListener('change',e=>{ const f=[...e.target.files]; e.target.value=''; if(idUpload){ const m=idUpload; idUpload=null; if(m==='new') idCreate(f,{}); else idAddImgs(f); } else if(evUpload) evAddArts(f); else addArts(f); });
  $('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeItem(); });
  $('#dsheet').addEventListener('click',e=>{ if(e.target.id==='dsheet') closeDay(); });
  document.addEventListener('error',e=>{ const t=e.target; if(t&&t.tagName==='IMG'&&t.closest('.art,.thumb,.tile')){ t.style.visibility='hidden'; } },true);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&mcp&&Date.now()-lastRead>120000) load(); });


  /* avisa quando houver versão nova do site publicada */
  (function(){ /* puxar para atualizar (celular) */
    let y0=null, dy=0; const TH=80; const ind=document.createElement('div'); ind.className='ptr'; ind.setAttribute('aria-hidden','true'); ind.innerHTML='<span class="ptr-c">↓</span><span class="ptr-t">Puxe para atualizar</span>'; document.body.appendChild(ind);
    const blocked=()=>[...document.querySelectorAll('.sheet')].some(x=>!x.hidden)||!!document.querySelector('#side.open')||!!document.querySelector('.qmenu:not([hidden])');
    const set=d=>{ ind.style.transform='translate(-50%,'+(Math.min(d,TH*1.4)-56)+'px)'; ind.style.opacity=String(Math.min(1,d/TH)); ind.classList.toggle('go',d>=TH); ind.querySelector('.ptr-t').textContent=d>=TH?'Solte para atualizar':'Puxe para atualizar'; ind.querySelector('.ptr-c').style.transform='rotate('+(d>=TH?180:Math.round(d/TH*180))+'deg)'; };
    window.addEventListener('touchstart',e=>{ if(e.touches.length!==1||window.scrollY>0||blocked()){ y0=null; return; } y0=e.touches[0].clientY; dy=0; },{passive:true});
    window.addEventListener('touchmove',e=>{ if(y0==null) return; dy=(e.touches[0].clientY-y0)*0.5; if(dy<=0||window.scrollY>0){ dy=0; set(0); return; } ind.classList.add('on'); set(dy); },{passive:true});
    window.addEventListener('touchend',()=>{ if(y0==null) return; y0=null; if(dy>=TH){ ind.classList.add('load'); ind.querySelector('.ptr-t').textContent='Atualizando…'; setTimeout(()=>location.reload(),150); } else { ind.classList.remove('on'); set(0); } dy=0; },{passive:true});
  })();
  (function(){ const cur=(document.querySelector('meta[name="belle-ver"]')||{}).content||'';
    async function chk(){ try{ const t=await (await fetch('index.html?'+Date.now(),{cache:'no-store'})).text(); const m=t.match(/name="belle-ver" content="(\d+)"/); if(m&&cur&&m[1]>cur&&!document.getElementById('nv')){ const b=document.createElement('button'); b.id='nv'; b.className='nv'; b.textContent='Nova versão do site disponível · toque para atualizar'; b.onclick=()=>location.reload(); document.body.appendChild(b); } }catch(_){} }
    setTimeout(chk,8000); setInterval(chk,120000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) chk(); }); })();
  /* ---------- início ---------- */
  renderAll();
  (async function init(){
    try{
      const res=await Promise.all([claude.use('mcp'),claude.use('db'),claude.use('assets'),claude.use('downloads')]);
      mcp=res[0]; db=res[1]; assets=res[2]; dls=res[3];
    }catch(_){}
    if(db){
      try{ db.collection('itens').onSnapshot(snap=>{
        const next=new Map(); snap.docs.forEach(d=>{ next.set(d.id,d.data()||{}); });
        queues.forEach((_,id)=>{ if(next.has(id)&&meta.has(id)&&timers.has(id)) next.set(id,meta.get(id)); });
        meta=next; dbReady=true; renderAll();
      },()=>{ toast('Não consegui sincronizar os checklists'); }); }catch(_){}
    }
    load();
  })();
})();
</script>
